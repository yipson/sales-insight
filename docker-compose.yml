version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: sales-insight-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-sales_insight}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sales_insight_secret}
      POSTGRES_DB: ${DB_NAME:-sales_insight}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sales_insight} -d ${DB_NAME:-sales_insight}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sales-insight-backend
    environment:
      - DATABASE_URL=postgres://${DB_USER:-sales_insight}:${DB_PASSWORD:-sales_insight_secret}@db:5432/${DB_NAME:-sales_insight}?sslmode=disable
      - CLOVER_CLIENT_ID=${CLOVER_CLIENT_ID}
      - CLOVER_CLIENT_SECRET=${CLOVER_CLIENT_SECRET}
      - CLOVER_ENV=${CLOVER_ENV:-sandbox}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - API_PORT=8080
      - FRONTEND_URL=http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - go_mod_cache:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy
    command: ["./main"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sales-insight-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    command: ["npm", "run", "dev", "--", "--host"]

volumes:
  postgres_data:
  go_mod_cache:
